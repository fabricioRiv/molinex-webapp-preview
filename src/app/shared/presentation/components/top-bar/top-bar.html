<mat-toolbar class="top-bar" role="banner">
  <div class="top-bar__identity">
    <button
      class="icon-button menu-button"
      type="button"
      [attr.aria-label]="'shell.open-navigation' | translate"
      (click)="menuToggled.emit()"
    >
      <span class="material-symbols-outlined" aria-hidden="true">menu</span>
    </button>
    <div>
      <span class="top-bar__eyebrow">Molinex</span>
      <strong>{{ 'shell.operations-center' | translate }}</strong>
    </div>
  </div>

  <div class="top-bar__actions">
    <label class="search" [attr.aria-label]="'shell.search-label' | translate">
      <span class="material-symbols-outlined" aria-hidden="true">search</span>
      <input type="search" [placeholder]="'shell.search-placeholder' | translate" />
      <kbd>Ctrl K</kbd>
    </label>

    <span class="top-bar__date">{{ formattedDate() }}</span>

    <app-language-switcher />

    <button
      class="icon-button notification-button"
      type="button"
      [attr.aria-label]="'shell.view-notifications' | translate"
    >
      <span class="material-symbols-outlined" aria-hidden="true">notifications</span>
      <span
        class="notification-button__badge"
        [attr.aria-label]="'shell.notification-count' | translate: { count: 3 }"
        >3</span
      >
    </button>
  </div>
</mat-toolbar>
